<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Iniciar sesión — Plataforma multimodal</title>
<link rel="stylesheet" href="/comun.css" />
</head>
<body>
<main class="wrap angosto">
  <h1>Plataforma multimodal</h1>
  <p class="sub">Evaluación de riesgo de ansiedad y depresión. Acceso solo para personal autorizado.</p>

  <div id="aviso" class="aviso" role="alert" hidden></div>

  <!-- method="post": si el JS no carga, la contraseña nunca termina en la URL -->
  <form id="form-login" class="card" method="post" novalidate>
    <h2>Iniciar sesión</h2>
    <div class="field">
      <label for="email">Correo</label>
      <input type="email" id="email" autocomplete="username" maxlength="254" required autofocus />
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" maxlength="256" required />
    </div>
    <button type="submit" id="btn-entrar" class="bloque">Entrar</button>
  </form>

  <p class="pie">¿Olvidaste tu contraseña? Pide a un administrador que la restablezca.<br />
     El uso de la plataforma queda registrado.</p>
</main>
<script src="/auth.js"></script>
<script src="/login.js"></script>
</body>
</html>
