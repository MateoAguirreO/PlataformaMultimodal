<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cambiar contraseña — Plataforma multimodal</title>
<link rel="stylesheet" href="/comun.css" />
<link rel="stylesheet" href="/sesion.css" />
</head>
<body>
<div class="wrap"><nav id="barra-sesion" class="barra-sesion" hidden></nav></div>
<main class="wrap angosto">
  <h1>Cambiar contraseña</h1>
  <p class="sub" id="motivo">Al cambiarla se cierran tus otras sesiones abiertas.</p>

  <div id="aviso" class="aviso" role="alert" hidden></div>

  <form id="form-cambio" class="card" method="post" novalidate>
    <div class="field">
      <label for="actual">Contraseña actual</label>
      <input type="password" id="actual" autocomplete="current-password" maxlength="256" required />
    </div>
    <div class="field">
      <label for="nueva">Nueva contraseña</label>
      <input type="password" id="nueva" autocomplete="new-password" maxlength="128" required />
      <p class="hint">Mínimo 10 caracteres, con letras y números, sin incluir tu usuario del correo.
        Una frase de varias palabras es más fácil de recordar y más segura.</p>
    </div>
    <div class="field">
      <label for="confirmar">Repite la nueva contraseña</label>
      <input type="password" id="confirmar" autocomplete="new-password" maxlength="128" required />
    </div>
    <button type="submit" id="btn-guardar" class="bloque">Guardar contraseña</button>
  </form>
</main>
<script src="/auth.js"></script>
<script src="/cambiar-password.js"></script>
</body>
</html>
